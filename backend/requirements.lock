# Pinned resolution of backend/pyproject.toml. CI installs this file, not the
# `>=` ranges next to it, and that is the whole point of it existing.
#
# Every dependency in pyproject.toml is a floor — `fastapi>=0.115` — so before
# this file each CI run resolved whatever PyPI held that morning. The API
# contract check (`scripts/generate_api_contract.py --check`) compares
# specs/openapi.json byte for byte against what the app generates, so an
# unpinned fastapi or pydantic makes that check fail on a day nobody touched
# the API, which is a gate that goes red at random and therefore stops being
# read. The floors in pyproject.toml still say what the code needs; this says
# what was actually tested.
#
# REGENERATING: resolve on the platform CI runs, which is Linux and the
# interpreter in .python-version — not a developer laptop. A resolution from
# macOS or from a different Python picks different versions (that is how it was
# produced the first time: `pip install -e "backend/[dev]"` in the CI job, then
# `pip freeze --exclude-editable`). Run it under that container or read it out
# of a workflow_dispatch run, and commit the result with the change that needed
# a new version.
#
# Bare `==` pins, not hashes: pinning fixes the version drift that was breaking
# the build. Hashes would additionally fix the artefact, which is a supply
# chain question this repository has not answered yet.

