[project]
name = "dcp-backend"
version = "0.1.0"
description = "Data Collection Platform — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "boto3>=1.35",
    "geoalchemy2>=0.15",
    "cryptography>=44.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13", "pglast>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a live Postgres (docker compose up -d postgres); deselect with -m 'not db'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Without this mypy reads a model's `__init__` off the dataclass_transform
# alone, so `Field(alias="opId")` looks like a constructor that takes `opId`
# and `populate_by_name = True` is invisible to it. That produced ten
# "unexpected keyword argument" errors against code the wire tests prove
# correct — the kind of false positive that teaches people to ignore mypy.
plugins = ["pydantic.mypy"]
[tool.setuptools]
packages = ["app"]
