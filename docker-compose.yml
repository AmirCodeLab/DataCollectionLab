services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: dcp
      POSTGRES_PASSWORD: dcp
      POSTGRES_DB: dcp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://dcp:dcp@postgres:5432/dcp
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]
    # specs/ is mounted for the same reason conformance/ is: the app reads
    # normative files at run time. The XLSForm importer needs
    # collectable-types-v0.1.json to tell an author whether a question will
    # work on a phone, and it refuses to import rather than guess if the
    # file is missing (see xlsform/datatypes.py).
    volumes: ["./backend:/app", "./conformance:/conformance:ro", "./specs:/specs:ro"]

volumes:
  pgdata:
  miniodata:
